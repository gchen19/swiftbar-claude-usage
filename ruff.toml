# Pin the rule set explicitly so CI and local runs agree regardless of the
# installed ruff's shifting defaults.
#
# E4/E7/E9 + F is ruff's documented default: import correctness, syntax errors,
# and the pyflakes checks that catch real defects (undefined names, unused
# imports, f-strings missing placeholders).
#
# Deliberately NOT enabled: BLE001 (blind except) and S110 (try-except-pass).
# This is a SwiftBar plugin — an uncaught exception renders as a broken menu bar,
# so the broad `except Exception: pass` around every cache, log, and network call
# is the intended design, not an oversight.
line-length = 100

[lint]
select = ["E4", "E7", "E9", "F"]
