name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege by default; no job here needs to write to the repo.
permissions:
  contents: read

jobs:
  compile:
    # SwiftBar runs the plugin via `#!/usr/bin/env python3`, which on a stock
    # macOS is the system interpreter — 3.9 as of macOS 15. Syntax that is fine
    # on a maintainer's newer Python (match statements, `X | None` annotations)
    # would break silently for those users, so 3.9 is the floor CI defends.
    name: compile (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Byte-compile plugin
        run: python -m py_compile claude-usage.1m.py

  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install ruff
        run: pip install ruff==0.16.1
      - name: Lint
        run: ruff check .

  smoke:
    # Must run on macOS: get_token() shells out to `security`, which does not
    # exist on Linux and would raise FileNotFoundError for reasons unrelated to
    # the plugin's actual health. Uses the runner's preinstalled python3 rather
    # than setup-python, matching how SwiftBar invokes the plugin.
    name: smoke (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Plugin survives a missing token
        run: python3 tests/smoke_test.py
